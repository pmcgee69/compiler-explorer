# Windows Local Deployment - Rust
# Local rustc installation

compilers=rustclocal
defaultCompiler=rustclocal

compiler.rustclocal.exe=C:\Users\User\.cargo\bin\rustc.exe
compiler.rustclocal.name=rustc (local)

supportsBinary=true
supportsBinaryObject=true
compilerType=rust
demangler=
demanglerArgs=
objdumper=C:\Program Files (x86)\Embarcadero\Dev-Cpp\TDM-GCC-64\bin\objdump.exe
stubRe=\bmain\b
stubText=pub fn main() {/*stub provided by Compiler Explorer*/}

versionFlag=-vV

libs=

# Clippy tool - optional, uncomment if clippy is installed
#tools=clippy
#tools.clippy.name=Clippy
#tools.clippy.exe=C:\Users\User\.cargo\bin\cargo-clippy.exe
#tools.clippy.type=postcompilation
#tools.clippy.class=clippy-tool
#tools.clippy.stdinHint=disabled
