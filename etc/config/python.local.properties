# Windows Local Deployment - Python
# Local Python installation
# Update the path below to match your Python installation

compilers=pythonlocal
defaultCompiler=pythonlocal

# Update this path to your Python installation
# Common locations:
# - C:\Python312\python.exe
# - C:\Users\User\AppData\Local\Programs\Python\Python312\python.exe
# - C:\Program Files\Python312\python.exe

compiler.pythonlocal.exe=python.exe
compiler.pythonlocal.name=Python (local)
# Uncomment and set semver if you want version ordering
#compiler.pythonlocal.semver=3.12

supportsBinary=false
interpreted=true
compilerType=python
objdumper=
instructionSet=python
